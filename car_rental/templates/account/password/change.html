{% extends 'base.html' %}
{% load i18n %}

{% block title %}Change Password - {{ site_info.company_name }}{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0"><i class="fas fa-key me-2"></i>Change Password</h4>
                </div>
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Choose a new password for your account</h3>
                    
                    <form method="post" action="{% url 'account_change_password' %}" class="needs-validation" novalidate>
                        {% csrf_token %}
                        
                        <!-- Old Password Field -->
                        <div class="mb-3">
                            <label for="id_oldpassword" class="form-label">Old Password</label>
                            <input type="password" name="oldpassword" required id="id_oldpassword" class="form-control" autocomplete="current-password">
                        </div>
                        
                        <!-- New Password Fields -->
                        <div class="mb-3">
                            <label for="id_password1" class="form-label">New Password</label>
                            <input type="password" name="password1" required id="id_password1" class="form-control" autocomplete="new-password">
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password2" class="form-label">Confirm New Password</label>
                            <input type="password" name="password2" required id="id_password2" class="form-control" autocomplete="new-password">
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Change Password
                            </button>
                            <a href="{% url 'account_email' %}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Back to Profile
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    // A little extra script to ensure password confirmation works
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('.needs-validation');
        if (form) {
            form.addEventListener('submit', function(event) {
                const password1 = document.getElementById('id_password1');
                const password2 = document.getElementById('id_password2');
                if (password1.value !== password2.value) {
                    event.preventDefault();
                    alert('New passwords do not match.');
                }
            });
        }
    });
</script>
{% endblock %}
